version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: booking-app
    environment:
      POSTGRES_USER: booking-app
      POSTGRES_PASSWORD: booking-app@123
      POSTGRES_DB: booking-db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
